<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'DimDim Digital - ' + ${titulo}">DimDim Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dimdim.css}">
</head>
<body>

<nav th:fragment="header(ativo)" class="navbar navbar-expand-lg navbar-dd">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="fa-solid fa-coins brand-coin"></i> DimDim Digital
        </a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'home'} ? 'active'" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'contas'} ? 'active'" th:href="@{/contas}">Contas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'transacoes'} ? 'active'" th:href="@{/transacoes}">Transações</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer-dd">
    <div class="container">DimDim - Tradição em servir bem e a incansável busca pela perfeição &middot; Projeto DevOps Tools &amp; Cloud Computing (FIAP)</div>
</footer>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
